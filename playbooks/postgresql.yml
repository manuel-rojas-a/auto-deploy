---
- name: Instalar y configurar PostgreSQL
  hosts: dbservers
  become: true
  vars:
    db_user: "appuser"
    db_password: "CHANGE_ME_USE_ANSIBLE_VAULT"

  tasks:
    - name: Instalar PostgreSQL
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: true

    - name: Habilitar servicio PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        enabled: true
        state: started

    - name: Configurar puerto en postgresql.conf
      ansible.builtin.lineinfile:
        path: /etc/postgresql/14/main/postgresql.conf
        regexp: "^port ="
        line: "port = {{ db_port }}"
      notify: Reiniciar PostgreSQL

    - name: Crear usuario de base de datos
      ansible.builtin.shell: |
        su - postgres -c "psql -c \"CREATE USER {{ db_user }} WITH PASSWORD '{{ db_password }}';\""
      ignore_errors: true

    - name: Crear base de datos
      ansible.builtin.shell: |
        su - postgres -c "psql -c \"CREATE DATABASE {{ db_name }} OWNER {{ db_user }};\""
      ignore_errors: true

  handlers:
    - name: Reiniciar PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted
