---
- name: Instalar Node Exporter para monitoreo
  hosts: all
  become: true
  vars:
    node_exporter_version: "1.6.1"
    node_exporter_port: 9100

  tasks:
    - name: Descargar Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"

    - name: Extraer Node Exporter
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /opt/
        remote_src: true

    - name: Mover binario a /usr/local/bin
      ansible.builtin.copy:
        src: /opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        remote_src: true
        mode: "0755"

    - name: Crear usuario node_exporter
      ansible.builtin.user:
        name: node_exporter
        shell: /usr/sbin/nologin
        create_home: false
        system: true

    - name: Crear servicio systemd
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/node_exporter.service
      notify: Reiniciar Node Exporter

    - name: Abrir puerto en firewall
      community.general.ufw:
        rule: allow
        port: "{{ node_exporter_port }}"
        proto: tcp

    - name: Habilitar e iniciar servicio
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started

  handlers:
    - name: Reiniciar Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
